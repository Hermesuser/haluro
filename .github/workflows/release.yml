name: Build & Release Native Apps (Windows 11 & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows11:
    name: Package Windows 11 Native Installer (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run dependency security audit (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Run automated pytest suite
        run: pytest -v

      - name: Run native host smoke test
        run: python native_app.py --smoke-test

      - name: Install Inno Setup 6 (Compiler)
        run: choco install innosetup --no-progress

      - name: Build Windows 11 Executable, Portable ZIP & Inno Setup Installer
        shell: pwsh
        run: ./packaging/windows/build_windows11.ps1 -SkipTests

      - name: Upload Windows 11 Installer & Portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Haluro-Windows11-x64
          path: |
            dist/Haluro-Setup-*.exe
            dist/Haluro-Portable-*.zip
            dist/SHA256SUMS-Windows11.txt

      - name: Create Official GitHub Release (Windows 11)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Haluro-Setup-*.exe
            dist/Haluro-Portable-*.zip
            dist/SHA256SUMS-Windows11.txt
          name: Haluro ${{ github.ref_name }} — Laboratorio Analógico Digital
          generate_release_notes: true
          draft: false
          prerelease: false
