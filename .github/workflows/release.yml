name: Build & Release Native Apps (Windows 11 & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (lint, audit, tests, smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Lint (ruff)
        run: ruff check . --exclude .venv,build,dist

      - name: Run dependency security audit (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Run automated pytest suite
        run: pytest -v

      - name: Verify the version is consistent across the whole tree
        run: python .github/scripts/check_version.py

  build-macos:
    name: Package macOS Native App (.app & .dmg)
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run automated pytest suite
        run: pytest -v

      - name: Run native host smoke test
        run: python native_app.py --smoke-test

      - name: Import macOS code-signing certificate (if configured)
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_CERT_PASSWORD != ''
        run: |
          set -euo pipefail
          echo "${MACOS_CERTIFICATE}" | base64 --decode > signing_cert.p12
          security create-keychain -p "${MACOS_CERT_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${MACOS_CERT_PASSWORD}" build.keychain
          security import signing_cert.p12 -k build.keychain -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${MACOS_CERT_PASSWORD}" build.keychain

      - name: Build macOS .app and .dmg
        env:
          HALIRO_CODESIGN_IDENTITY: ${{ env.MACOS_IDENTITY }}
        run: ./packaging/macos/build_macos.sh

      - name: Code sign macOS DMG (if signing identity configured)
        if: env.MACOS_IDENTITY != ''
        run: |
          set -euo pipefail
          DMG_PATH=$(find dist -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -n "${DMG_PATH}" ]; then
            codesign --force --sign "${MACOS_IDENTITY}" "${DMG_PATH}"
          fi

      - name: Notarize macOS artifacts (Apple notarytool)
        if: env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          DMG_PATH=$(find dist -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -n "${DMG_PATH}" ]; then
            xcrun notarytool submit "${DMG_PATH}" \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --wait
            xcrun stapler staple "${DMG_PATH}"
          fi

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haluro-macOS-${{ matrix.arch }}
          path: |
            dist/Haluro-*-macOS-*.dmg
            dist/SHA256SUMS-macOS-*.txt

  build-windows11:
    name: Package Windows 11 Native Installer (.exe & .zip)
    runs-on: windows-latest
    needs: quality-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run dependency security audit (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Run automated pytest suite
        run: pytest -v

      - name: Run native host smoke test
        run: python native_app.py --smoke-test

      - name: Install Inno Setup 6 (Compiler)
        run: choco install innosetup --no-progress

      - name: Build Windows 11 Executable, Portable ZIP & Inno Setup Installer
        shell: pwsh
        run: ./packaging/windows/build_windows11.ps1 -SkipTests

      - name: Upload Windows 11 Installer & Portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Haluro-Windows11-x64
          path: |
            dist/Haluro-Setup-*.exe
            dist/Haluro-Portable-*.zip
            dist/SHA256SUMS-Windows11.txt

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows11]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every packaged artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Merge the per-architecture macOS checksum manifests
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if compgen -G "SHA256SUMS-macOS-*.txt" > /dev/null; then
            cat SHA256SUMS-macOS-*.txt | sort > SHA256SUMS-macOS.txt
            rm -f SHA256SUMS-macOS-arm64.txt SHA256SUMS-macOS-x86_64.txt
            echo "SHA256SUMS-macOS.txt:" && cat SHA256SUMS-macOS.txt
          fi

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          name: Haluro ${{ github.ref_name }} — Laboratorio Analógico Digital
          generate_release_notes: true
          draft: false
          prerelease: false
