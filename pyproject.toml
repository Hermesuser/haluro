[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haluro"
version = "2.4.3"
description = "Haluro — Laboratorio Analógico Digital (macOS & Windows 11 Native App)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "César Fernández Ardiles (Oregano, Chile)" },
]
dependencies = [
  "flask>=3.0.0,<4.0.0",
  "Pillow>=13.0.0,<14.0.0",
  "numpy>=1.26.0,<3.0.0",
  "scipy>=1.12.0,<2.0.0",
  "rawpy>=0.21.0,<1.0.0",
  "pywebview>=5.0.0,<7.0.0",
  "pythonnet>=3.0.3; sys_platform == 'win32'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
heif = [
  "pillow-heif>=0.16.0",
]
dev = [
  "pytest>=9.0.0",
  "pyinstaller>=6.6.0,<7.0.0",
  "pip-audit>=2.7.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S"]
ignore = ["S603", "S607"]
